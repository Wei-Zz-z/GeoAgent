[project]
name = "geoagent"
version = "0.1.0"
description = "GeoAgent - conversational geospatial analysis backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.60.0",
    "pydantic>=2.9.0",
    "asyncpg>=0.30.0",
    "python-docx>=1.1.0",
    "shapely>=2.1.2",
    "geopandas>=1.1,<2",
    "pyogrio>=0.13,<1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.20",
    "pyrosm>=0.13.1",
    "networkx>=3.6.1",
    "mcp>=2,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
