# GeoAgent 反向代理配置：静态前端 + 后端 API/WebSocket + MCP
# 部署到 /etc/nginx/conf.d/geoagent.conf，按需修改 server_name 与证书路径
server {
    listen 443 ssl;
    server_name <域名>;
    ssl_certificate     /etc/nginx/ssl/<证书>.crt;
    ssl_certificate_key /etc/nginx/ssl/<私钥>.key;

    # 套合入库要上传整套 Shapefile（可能上 GB）
    client_max_body_size 4096m;
    client_body_timeout  600s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/geoagent.access.log;
    error_log  /var/log/nginx/geoagent.error.log;

    root /opt/geoagent/web;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;      # 前端路由回退
    }

    # 后端 API（含 WebSocket 对话流）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 600s;               # 一轮问答可能分钟级
        proxy_send_timeout 600s;
    }

    # MCP 对外接口：流式响应必须关缓冲
    location /mcp/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}